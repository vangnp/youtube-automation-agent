  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dx="0" dy="8" result="off"/><feColorMatrix in="off" type="matrix" values="0 0 0 0 .18 0 0 0 0 .09 0 0 0 0 .02 0 0 0 .25 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .ink{stroke:#67391F;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .ink2{stroke:#67391F;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
