<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400">
<title>Yang Tò Mò — mascot vector có thể chỉnh sửa</title>
<desc>Phiên bản SVG nâng cấp với các lớp màu, viền, highlight và nhóm bộ phận riêng. Nền trong suốt.</desc>
<defs>
  <linearGradient id="goldFur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFE18B"/><stop offset=".42" stop-color="#FFBD43"/><stop offset="1" stop-color="#E8871B"/></linearGradient>
  <linearGradient id="maneDeep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD56A"/><stop offset=".55" stop-color="#F5A52B"/><stop offset="1" stop-color="#C96C17"/></linearGradient>
  <linearGradient id="horn" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#FFD98B"/><stop offset=".3" stop-color="#C98536"/><stop offset=".7" stop-color="#8B4B21"/><stop offset="1" stop-color="#5E321D"/></linearGradient>
  <linearGradient id="wool" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#FFFEF8"/><stop offset=".55" stop-color="#FFF2D9"/><stop offset="1" stop-color="#E8CDA7"/></linearGradient>
  <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164665"/><stop offset=".5" stop-color="#092B45"/><stop offset="1" stop-color="#04182C"/></linearGradient>
  <radialGradient id="eye" cx=".35" cy=".25" r=".8"><stop stop-color="#4C9BC4"/><stop offset=".4" stop-color="#193E5A"/><stop offset="1" stop-color="#091827"/></radialGradient>
